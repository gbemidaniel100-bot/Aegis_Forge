[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-forge"
version = "0.5.0"
description = "Local-first AI incident operations workbench with agents, RAG, tools, memory, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]
rag = ["sentence-transformers>=3.0.0"]

[project.scripts]
aegis = "aegis_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_forge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
